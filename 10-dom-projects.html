<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Projects</title>
    <style>
        .subscribe-button {
             border:none;
             background-color: black;
             color: aliceblue;
             padding: 10px 15px;
             font-weight: bold;
             border-radius: 50px;
             cursor: pointer;
             margin-bottom: 30px;
        }

        .is-subscribed {
            border:none;
             background-color:rgb(227, 223, 223);
             color: rgb(23, 24, 24);
        }

        body {
            font-family: Arial;
        }


        .cost-input {
            font-size: 15px;
            padding: 10px;

        }

        .calculate-button {
            background-color: rgb(121, 180, 32);
            color: white;
            border: none;
            font-size: 15;
            padding: 12px 15px;
            cursor: pointer;
        }
        
    </style>
</head>


<body>
    <!--Subscribe button-->
    <p>Youtube Subscribe Button</p>
    <button onclick="
        subscribe();

    " class="js-subscribe-button subscribe-button">Subscribe</button>



    <!--Shipping Project-->
    <p>Amazon Shipping Calculator</p>
    <input placeholder="Cost of order" class="js-cost-input cost-input" onkeydown="
    handleCostKeydown(event);
"/>
    <button onclick="
            calculateTotal();
        " class="calculate-button">Calculate</button>

    <p class="js-total-cost"></p>



    <!--Rock, papper, scissors-->
    <h2>Rock, Paper, Scissors Game</h2>

    <button onclick="
    playGame('rock');
    ">Rock</button>

    <button onclick="
    playGame('paper');
    ">Paper</button>

    <button onclick="
    playGame('scissors');
    ">Scissors</button>



    <p class="js-result"></p>

    <p class="js-moves"></p>

    <p class="js-score"></p>

    <button onclick="

        resetScore();
        updateScoreElement();
    ">Reset Score</button>





    <!-----------------------------javaScriptArea-------------------------------------------------------->


    <script>



        // <!--Subscribe button-->

        function subscribe(){
            const buttonElement = document.querySelector('.js-subscribe-button');

            if(buttonElement.innerText === 'Subscribe') {
                buttonElement.innerText = 'Subscribed';
                buttonElement.classList.add('is-subscribed');
            } else if(buttonElement.innerText === 'Subscribed'){
                buttonElement.innerText = 'Subscribe';
                buttonElement.classList.remove('is-subscribed');

            }
        }


        //    <!--Shipping Project-->

        function handleCostKeydown(event) {
            if (event.key === 'Enter') {
                calculateTotal();
            }
        }



        function calculateTotal() {
            const inputElement = document.querySelector('.js-cost-input');
            let cost = Number(inputElement.value);

            if (cost < 40) {
                cost = cost + 10;
            }

            document.querySelector('.js-total-cost').innerHTML = `The total cost is: $ ${cost}`;
        }
    


            // <!--Rock, papper, scissors-->

        
        let score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            losses: 0,
            ties: 0
        };


        updateScoreElement();


        function playGame(playerMove){
            const computerMove = pickComputerMove();
           
            let result = '';

            if(playerMove === 'rock'){
                 if(computerMove === 'rock'){
                    result = 'you are tied';
                }else if(computerMove === 'paper'){
                    result = 'you lose';
                }else if(computerMove === 'scissors'){
                    result = 'you win';

                }

                } else if(playerMove === 'paper'){
                    if(computerMove === 'paper'){
                    result = 'you are tied';
                }else if(computerMove === 'scissors'){
                    result = 'you lose';
                }else if(computerMove === 'rock'){
                    result = 'you win';

                }

                }else if(playerMove === 'scissors') {
                    if(computerMove === 'scissors'){
                    result = 'you are tied';
                }else if(computerMove === 'rock'){
                    result = 'you lose';
                }else if(computerMove === 'paper'){
                    result = 'you win';

                }

                }

                if(result === 'you win') {
                    // score.wins = score.wins + 1;
                    score.wins += 1;
                } else if (result === 'you lose') {
                    score.losses += 1;

                } else if (result === 'you are tied') {
                    score.ties += 1;

                }

                localStorage.setItem('score', JSON.stringify(score));



            document.querySelector('.js-result').innerHTML = result;
            document.querySelector('.js-moves').innerHTML = `You: ${playerMove} - Computer: ${computerMove}`;

            updateScoreElement();


            }


            function updateScoreElement(){
                document.querySelector('.js-score').innerHTML = `Wins: ${score.wins} Losses: ${score.losses} Ties: ${score.ties}`;

            }


            function pickComputerMove() {
                const randomNumber = Math.random();
                
                let computerMove = '';

                if(randomNumber >= 0 && randomNumber < 1/3) {
                    computerMove = 'rock';
                }else if(randomNumber >= 1/3 && randomNumber < 2/3){
                    computerMove = 'paper';
                }else if(randomNumber >= 2/3 && randomNumber < 1 ){
                    computerMove = 'scissors';
                }
                return computerMove;
            }


            function resetScore() {
                localStorage.removeItem('score');
                score = { wins: 0, losses: 0, ties: 0 };
                // alert('Score has been reset!');
            }



    </script>

</body>

</html>
