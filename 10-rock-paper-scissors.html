<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Projects</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family:Arial;
        }

        .title {
            font-size: 30px;
            font-weight: bold;
        }

        .move-icon {
            height: 50px;
            display: inline-block;
            /* margin-left: 17px; */
            /* padding-left: 15px; */
        }

        .move-button {
            background-color: transparent;
            border: 3px solid white;
            width: 120px;
            height: 120px;
            border-radius: 60px;
            margin-right: 10px;
            cursor: pointer;
        }

        .moves {
            display: inline-flex;
        }

        .result {
            font-size: 25px;
            font-weight: bold;
            margin-top: 50px;
        }

        .score {
            margin-top: 60px;
        }

        .reset-score-button {
            background-color: white;
            border:none;
            font-size: 15px;
            padding: 8px 15px;
            cursor: pointer;
        }



    </style>
</head>


<body>
    <!--Rock, papper, scissors-->
    <h2 class="title">Rock, Paper, Scissors Game</h2>

    <button onclick="
    playGame('rock');
    " class="move-button"><img src="./public/rock-emoji.png" class="move-icon" />Rock</button>

    <button onclick="
    playGame('paper');
    " class="move-button"><img src="./public/paper-emoji.png" class="move-icon" />Paper</button>

    <button onclick="
    playGame('scissors');
    " class="move-button"><img src="./public/scissors-emoji.png" class="move-icon" />Scissors</button>


    <p class="js-result" class="result"></p>

    <p class="js-moves" class="moves">
    </p>

    <p class="js-score"></p>

    <button onclick="
        resetScore();
        updateScoreElement();
    " class="reset-score-button">Reset Score</button>



    <!-----------------------------javaScriptArea-------------------------------------------------------->


    <script>

            // <!--Rock, papper, scissors-->
        
        let score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            losses: 0,
            ties: 0
        };


        updateScoreElement();


        function playGame(playerMove){
            const computerMove = pickComputerMove();
           
            let result = '';

            if(playerMove === 'rock'){
                 if(computerMove === 'rock'){
                    result = 'You are tied';
                }else if(computerMove === 'paper'){
                    result = 'You lose';
                }else if(computerMove === 'scissors'){
                    result = 'You win';

                }

                } else if(playerMove === 'paper'){
                    if(computerMove === 'paper'){
                    result = 'You are tied';
                }else if(computerMove === 'scissors'){
                    result = 'You lose';
                }else if(computerMove === 'rock'){
                    result = 'You win';

                }

                }else if(playerMove === 'scissors') {
                    if(computerMove === 'scissors'){
                    result = 'You are tied';
                }else if(computerMove === 'rock'){
                    result = 'You lose';
                }else if(computerMove === 'paper'){
                    result = 'You win';

                }

                }

                if(result === 'You win') {
                    // score.wins = score.wins + 1;
                    score.wins += 1;
                } else if (result === 'You lose') {
                    score.losses += 1;

                } else if (result === 'You are tied') {
                    score.ties += 1;

                }

                localStorage.setItem('score', JSON.stringify(score));



            document.querySelector('.js-result').innerHTML = result;
            // document.querySelector('.js-moves').innerHTML = `You: ${playerMove} - Computer: ${computerMove}`;

            document.querySelector('.js-moves').innerHTML = `You
        <img src="public/${playerMove}-emoji.png" class="move-icon" />
        <img src="public/${computerMove}-emoji.png" class="move-icon" />
        Computer`;




















            updateScoreElement();


            }


            function updateScoreElement(){
                document.querySelector('.js-score').innerHTML = `Wins: ${score.wins} Losses: ${score.losses} Ties: ${score.ties}`;

            }


            function pickComputerMove() {
                const randomNumber = Math.random();
                
                let computerMove = '';

                if(randomNumber >= 0 && randomNumber < 1/3) {
                    computerMove = 'rock';
                }else if(randomNumber >= 1/3 && randomNumber < 2/3){
                    computerMove = 'paper';
                }else if(randomNumber >= 2/3 && randomNumber < 1 ){
                    computerMove = 'scissors';
                }
                return computerMove;
            }


            function resetScore() {
                localStorage.removeItem('score');
                score = { wins: 0, losses: 0, ties: 0 };
            }



    </script>

</body>

</html>
