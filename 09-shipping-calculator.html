<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>




<body>
    <p>Amazon Shipping Calculator</p>
    <input placeholder="Cost of order" class="js-cost-input" />
    <button
        onclick="
            calculateTotal();
        " 
        onkeydown="
            handleCostKeydown(event);
        "
    >Calculate</button>

    <p class="js-total-cost"></p>
    
    <!-- Steps:
    1 when we click the button, we will get the number of the inout
    2 if amount is < 40, add $10; if it is >= 40, add no extra money
    3 Diaplay total on the page -->


    <script>

        function handleCostKeydown(event) {
            if (event.key === 'Enter') {
                calculateTotal();
            }
        }



        function calculateTotal() {
            const inputElement = document.querySelector('.js-cost-input');
            let cost = Number(inputElement.value);

            if (cost < 40) {
                cost = cost + 10;
            }

            document.querySelector('.js-total-cost').innerHTML = `The total cost is: $ ${cost}`;
        }

    </script>







</body>
</html>
